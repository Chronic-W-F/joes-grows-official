<script>

const products = [

{
  code:"JG-01",

  name:"Joe's Grows Hat Collection",

  price:20,

  description:"Choose from 16 available hat styles. Some photos contain multiple hats.",

  image:"joes-grows-black-hat.jpeg",

  gallery:[
    "joes-grows-black-hat.jpeg",
    "seed-2-smoke-podcast-black-hat.jpeg",
    "joes-grows-nugs-not-drugs-black-hat.jpeg",
    "joes-grows-pheno-hunter-green-hat.jpeg",
    "joes-grows-certified-og-black-hat.jpeg",
    "ghost-cut-emerald-frost-hats.jpeg",
    "midnight-resin-paper-and-ash-smoke-show-hats.jpeg",
    "gorilla-grow-harvest-hunter-hats.jpeg",
    "og-emerald-hat.jpeg",
    "nugs-not-drugs-black-hat.jpeg",
    "solauto-black-hat.jpeg",
    "solauto-cup-black-hat.jpeg"
  ],

  options:[
    "Joe's Grows Black Hat",
    "Seed 2 Smoke Podcast Black Hat",
    "Joe's Grows Nugs Not Drugs Black Hat",
    "Joe's Grows Pheno Hunter Green Hat",
    "Joe's Grows Certified OG Black Hat",
    "Ghost Cut Hat",
    "Emerald Frost Hat",
    "Midnight Resin Hat",
    "Paper & Ash Hat",
    "Smoke Show Hat",
    "Gorilla Grow Hat",
    "Harvest Hunter Hat",
    "OG Emerald Hat",
    "Nugs Not Drugs Black Hat",
    "Solauto Black Hat",
    "Solauto Cup Black Hat"
  ]
},

{
  code:"JG-02",

  name:"The Bud Buddy",

  price:35,

  description:"Cannabis grow tent organizer shelf with built-in week tracker.",

  image:"t-b-b-white.jpeg",

  gallery:[
    "t-b-b-1.jpeg",
    "t-b-b-2.jpeg",
    "t-b-b-3.png",
    "t-b-b-4.jpeg",
    "t-b-b-white.jpeg",
    "t-b-b-red.png",
    "t-b-b-green.png",
    "t-b-b-blue.png"
  ],

  options:[
    "White",
    "Red",
    "Green",
    "Blue"
  ]
}

];

let cart = [];

const productGrid =
document.getElementById("productGrid");

products.forEach((product,index)=>{

let galleryHTML = "";

if(product.gallery){

galleryHTML = `
<div class="gallery">

${product.gallery.map(img => `

<img
src="/images/${img}"
onclick="openLightbox('/images/${img}')"
onerror="this.style.display='none'"
>

`).join("")}

</div>
`;
}

let optionHTML = "";

if(product.options){

optionHTML = `

<select
class="option-select"
id="option-${index}"
onchange="updateSelectionPreview(${index})">

<option value="">
Select Option
</option>

${product.options.map(option => `

<option value="${option}">
${option}
</option>

`).join("")}

</select>

<div class="option-help">
Choose your exact style before adding to cart.
</div>

<div
class="selection-preview"
id="preview-${index}">

Selection will appear here.

</div>

`;
}

productGrid.innerHTML += `

<div class="card">

<img
class="main-product-img"
src="/images/${product.image}"
alt="${product.name}"
onerror="this.style.display='none'"
>

${galleryHTML}

<div class="card-title">
${product.name}
</div>

<div class="price">
$${product.price}
</div>

<div class="card-text">
${product.description}
</div>

${optionHTML}

<br>

<button
class="cart-btn"
onclick="addToCart(${index})">

Add To Cart

</button>

</div>

`;
});

function updateSelectionPreview(index){

const select =
document.getElementById(`option-${index}`);

const preview =
document.getElementById(`preview-${index}`);

if(select.value === ""){

preview.innerHTML =
"Selection will appear here.";

return;
}

preview.innerHTML = `
Selected:<br><br>
<strong>${select.value}</strong>
`;
}

function addToCart(index){

const product = {...products[index]};

if(product.options){

const selectedOption =
document.getElementById(`option-${index}`).value;

if(selectedOption === ""){

alert("Please select an option.");

return;
}

product.selectedOption = selectedOption;
}

cart.push(product);

renderCart();
}

function removeFromCart(index){

cart.splice(index,1);

renderCart();
}

function renderCart(){

const cartItems =
document.getElementById("cartItems");

const cartTotal =
document.getElementById("cartTotal");

cartItems.innerHTML = "";

let subtotal = 0;

cart.forEach((item,index)=>{

subtotal += item.price;

cartItems.innerHTML += `

<div class="cart-item">

${item.code}
-
${item.name}

${item.selectedOption ? `
<br>
Selection:
${item.selectedOption}
` : ""}

<br>
$${item.price}

<br><br>

<button
class="cart-btn"
onclick="removeFromCart(${index})">

Remove

</button>

</div>

`;
});

cartTotal.innerHTML =
`Subtotal: $${subtotal}`;
}

function submitOrder(){

if(cart.length === 0){

alert("Cart is empty.");

return;
}

let body =
"Joe's Grows Order:%0D%0A%0D%0A";

cart.forEach(item => {

body += `${item.code} - ${item.name}`;

if(item.selectedOption){

body += ` - ${item.selectedOption}`;
}

body += ` - $${item.price}%0D%0A`;
});

body += `%0D%0A`;
body += `Customer Name:%0D%0A`;
body += `Shipping Address:%0D%0A`;
body += `Email:%0D%0A`;

window.location.href =
`mailto:joethegrowguy@gmail.com?subject=Joe's Grows Order&body=${body}`;
}

function openLightbox(src){

document.getElementById("lightboxImg").src = src;

document
.getElementById("lightbox")
.classList.add("active");
}

function closeLightbox(){

document
.getElementById("lightbox")
.classList.remove("active");
}

</script>
