<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Joe's Grows Swag</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#050505;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

header{
  padding:34px 15px 24px;
  background:#000;
  border-bottom:2px solid #39ff14;
}

header h1{
  color:#39ff14;
  font-size:2.7rem;
  text-shadow:0 0 15px #39ff14;
  margin-bottom:10px;
}

header p{
  color:#ccc;
  font-size:1rem;
}

.motto{
  margin-top:18px;
  font-size:2rem;
  font-weight:900;
  color:#39ff14;
  text-shadow:0 0 15px #39ff14;
}

.nav{
  padding:18px 10px;
  background:#050505;
}

.nav a{
  display:inline-block;
  margin:6px;
  padding:12px 17px;
  border:1px solid #39ff14;
  border-radius:999px;
  color:white;
  text-decoration:none;
  font-weight:bold;
  background:#111;
}

.container{
  width:100%;
  max-width:1400px;
  margin:auto;
  padding:20px;
}

.section{
  margin:35px 0;
}

.section-title{
  font-size:2rem;
  color:#39ff14;
  text-align:center;
  margin-bottom:25px;
  text-shadow:0 0 10px #39ff14;
}

.info-box{
  background:#111;
  border:2px solid #222;
  border-radius:20px;
  padding:24px;
  max-width:900px;
  margin:auto;
  color:#d6d6d6;
  line-height:1.6;
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:25px;
}

.card{
  background:#111;
  border:2px solid #222;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 0 20px rgba(0,0,0,0.6);
}

.main-product-img{
  width:100%;
  display:block;
  border-bottom:2px solid #222;
}

.gallery{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:12px;
  background:#0d0d0d;
}

.gallery img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:12px;
  border:2px solid #222;
  cursor:pointer;
}

.gallery img:hover{
  border-color:#39ff14;
}

.card-content{
  padding:20px;
}

.card-title{
  font-size:1.5rem;
  margin-bottom:10px;
  color:#39ff14;
}

.price{
  font-size:1.3rem;
  margin-bottom:15px;
  font-weight:bold;
}

.card-text{
  color:#ccc;
  line-height:1.5;
  margin-bottom:18px;
}

.shipping-note{
  color:#39ff14;
  font-weight:bold;
  margin-bottom:12px;
}

.option-select{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  background:#1a1a1a;
  color:white;
  font-size:1rem;
  margin-bottom:10px;
}

.option-help{
  color:#999;
  font-size:.9rem;
  margin-bottom:12px;
}

.selection-preview{
  background:#0d0d0d;
  border:1px solid #39ff14;
  border-radius:12px;
  padding:12px;
  color:#39ff14;
  margin-bottom:15px;
  min-height:60px;
}

.cart-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:#39ff14;
  color:black;
  font-size:1rem;
  font-weight:bold;
  cursor:pointer;
}

.cart-section{
  margin-top:50px;
  background:#111;
  border:2px solid #222;
  border-radius:20px;
  padding:25px;
}

.cart-item{
  padding:15px;
  border-bottom:1px solid #222;
  line-height:1.6;
}

.cart-total{
  margin-top:20px;
  font-size:1.4rem;
  color:#39ff14;
  font-weight:bold;
}

.shipping-total{
  margin-top:12px;
  color:#ccc;
  line-height:1.5;
}

.submit-btn{
  margin-top:20px;
  width:100%;
  padding:16px;
  background:#39ff14;
  color:black;
  border:none;
  border-radius:15px;
  font-size:1.1rem;
  font-weight:bold;
  cursor:pointer;
}

.qr-img{
  width:320px;
  max-width:95%;
  margin-top:18px;
  border-radius:14px;
}

.link-btn{
  display:block;
  width:fit-content;
  margin:16px auto;
  padding:14px 28px;
  border:2px solid #39ff14;
  border-radius:999px;
  color:white;
  text-decoration:none;
  font-weight:bold;
}

.lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.lightbox.active{
  display:flex;
}

.lightbox img{
  max-width:90%;
  max-height:90%;
  border-radius:20px;
}

.close-lightbox{
  position:absolute;
  top:20px;
  right:20px;
  color:white;
  font-size:2rem;
  cursor:pointer;
}

footer{
  padding:40px 20px;
  color:#777;
}
</style>
</head>

<body>

<header>
  <h1>Joe's Grows Swag</h1>
  <p>Rooting Deep • Harvesting Knowledge</p>
  <div class="motto">NUGS NOT DRUGS</div>
</header>

<nav class="nav">
  <a href="#about">About</a>
  <a href="#products">Products</a>
  <a href="#cart">Cart</a>
  <a href="#worksheet">Worksheet</a>
  <a href="#links">Links</a>
</nav>

<div class="container">

  <section class="section" id="about">
    <div class="section-title">About Joe's Grows</div
